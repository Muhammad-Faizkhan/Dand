name: dandcollection
description: "DAN D COLLECTION - collectible chip marketplace app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  provider: ^6.1.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  google_maps_flutter: ^2.19.0
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lets the tests swap a fake in for the camera/gallery picker.
  image_picker_platform_interface: ^2.11.1
  share_plus_platform_interface: ^7.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
